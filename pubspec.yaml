name: univalle_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  barcode_widget: ^2.0.4
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  html: ^0.15.7
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.4
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/svg/icons/
    - assets/img/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/img/univalle_logo_splash.png
  android_12:
    image: assets/img/univalle_logo_splash_android12.png
    icon_background_color: "#EE322F"
    color: "#FFFFFF"
  android: true
  ios: false
  web: false
